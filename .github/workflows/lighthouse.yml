name: Lighthouse

on:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse — Accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crabitan_bellevue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run schema on test DB
        run: mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/schema.sql

      - name: Seed test user for Lighthouse auth
        run: |
          HASH=$(php -r "echo password_hash('Dev123456789!', PASSWORD_BCRYPT);")
          mysql -h 127.0.0.1 -u root -proot crabitan_bellevue -e "
            INSERT IGNORE INTO accounts
              (email, password, role, lang, email_verified_at, created_at)
            VALUES
              ('client.verifie@dev.local', '$HASH', 'customer', 'fr', NOW(), NOW());
          "

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8080
          APP_NAME="Château Crabitan Bellevue"
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=crabitan_bellevue
          DB_USER=root
          DB_PASS=root
          JWT_SECRET=ci-lighthouse-secret
          JWT_EXPIRY=3600
          MAIL_HOST=localhost
          MAIL_PORT=587
          MAIL_USER=noreply@crabitanbellevue.fr
          MAIL_PASS=unused
          MAIL_FROM_NAME="Château Crabitan Bellevue"
          DB_ENCRYPT_KEY=ci-lighthouse-encrypt-key
          EOF

      - name: Build assets
        run: npm run build

      - name: Start PHP server
        run: php -S 0.0.0.0:8080 -t public/ public/router.php &

      - name: Wait for server
        run: curl --retry 15 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://localhost:8080/

      - name: Install Chrome
        uses: browser-actions/setup-chrome@facf10a55b9caf92e0cc749b4f82bf8220989148 # v1.7.2
        id: setup-chrome

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npx lhci autorun
          npx lhci upload --target=filesystem --outputDir=./lighthouse-reports || true

      - name: Lighthouse — résumé agrégé
        if: always()
        run: |
          echo "## Lighthouse CI — Résultats" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Perf | A11y | SEO |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|-----|" >> $GITHUB_STEP_SUMMARY
          for f in $(find lighthouse-reports -name "lhr-*.json" 2>/dev/null); do
            [ -f "$f" ] || continue
            url=$(jq -r '.finalUrl' "$f")
            perf=$(jq -r '(.categories.performance.score // 0) * 100 | round | tostring' "$f")
            a11y=$(jq -r '(.categories.accessibility.score // 0) * 100 | round | tostring' "$f")
            seo=$(jq -r '(.categories.seo.score // 0) * 100 | round | tostring' "$f")
            echo "| $url | ${perf}% | ${a11y}% | ${seo}% |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-reports/
          retention-days: 7
