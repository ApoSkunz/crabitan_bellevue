name: Mutation Testing JS (Stryker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mutation:
    name: Stryker MSI ≥ 50%
    runs-on: ubuntu-latest
    # Non bloquant — ne fait pas échouer le pipeline principal
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation tests
        run: npm run mutation:js

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-mutation-report
          path: build/stryker/
          retention-days: 30
