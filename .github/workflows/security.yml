name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@fe5624c70923355128868cffd647b6e2cfe11443 # v3.81.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  exakat:
    name: SAST — Exakat PHP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Blue Team: image exakat/exakat-ga (dédiée CI, pas de phar ni version numérotée requise).

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Run Exakat SAST (exakat-ga)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            exakat/exakat-ga:latest \
            > exakat-report.txt 2>&1 || true
          cat exakat-report.txt

      - name: Upload Exakat report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: exakat-report
          path: exakat-report.txt
          retention-days: 7

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # upload SARIF results
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@439137e1b50c27ba9e2f9befc93e43091b449c34 # v3.32.0
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@439137e1b50c27ba9e2f9befc93e43091b449c34 # v3.32.0

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Semgrep Scan
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/php
            p/owasp-top-ten
            p/security-audit
            p/jwt
            p/sql-injection
            p/xss
            p/command-injection
            p/secrets

  legitify:
    name: Legitify GitHub Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Blue Team: CLI binary direct (pas l'action GitHub) car Legit-Labs/legitify@v1.0.2
    # utilise upload-artifact@v3 deprecated — l'action échoue au setup avant tout step.
    # On télécharge le binaire depuis GitHub Releases et on l'exécute directement.

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Install & run Legitify CLI
        env:
          SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGITIFY_VERSION: '1.0.2'
        run: |
          curl -fsSL \
            "https://legitify.legitsecurity.com/${LEGITIFY_VERSION}/linux/amd64.tar.gz" \
            -o legitify.tar.gz
          tar -xzf legitify.tar.gz
          chmod +x legitify
          ./legitify analyze \
            --repo "$GITHUB_REPOSITORY" \
            || true  # non-bloquant : résultats informatifs uniquement

