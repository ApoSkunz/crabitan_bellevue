name: DAST — Full Scan (ISO prod)

# Credentials seed (données mock — jamais en production) :
#   super_admin : superadmin@dev.local  / Dev123456789!  / device_token: mock-jwt-admin-active-001
#   admin       : admin@dev.local       / Dev123456789!  / device_token: mock-jwt-admin-active-001
#   customer    : client.verifie@dev.local / Dev123456789! / device_token: mock-jwt-sophie-active-001

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  zap-full:
    name: ZAP Full Scan — PHP server ISO prod (3 rôles)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crabitan_bellevue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, zip, intl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies & build
        run: npm ci --ignore-scripts && npm run build

      - name: Apply schema & seed
        run: |
          mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/schema.sql
          mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/seed_mock_data.sql

      - name: Create .env (APP_ENV=test — cookies non-secure pour HTTP local)
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8080
          APP_NAME="Château Crabitan Bellevue"
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=crabitan_bellevue
          DB_USER=root
          DB_PASS=root
          JWT_SECRET=dast-ci-jwt-secret-not-for-prod
          JWT_EXPIRY=3600
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_FROM_NAME="Château Crabitan Bellevue"
          MAIL_NOREPLY_USER=noreply@crabitanbellevue.fr
          MAIL_NOREPLY_PASS=unused
          CONTACT_OWNER_EMAIL=owner@crabitanbellevue.fr
          DPO_EMAIL=dpo@crabitanbellevue.fr
          SECURITY_EMAIL=security@crabitanbellevue.fr
          DB_ENCRYPT_KEY=dast-ci-encrypt-key-not-for-prod
          DEFAULT_LANG=fr
          EOF

      - name: Start PHP built-in server
        run: php -S 0.0.0.0:8080 -t public/ public/router.php &

      - name: Wait for server
        run: curl --retry 15 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://localhost:8080/

      - name: Resolve host IP for ZAP Docker target
        id: host-ip
        run: echo "ip=$(ip route show default | awk '/default/{print $3}')" >> $GITHUB_OUTPUT

      # ── Authentification customer (client.verifie@dev.local) ──────────────────
      - name: Login — customer
        id: auth-customer
        run: |
          BASE="http://localhost:8080"

          # Pré-seed cookie jar au format Netscape : age_verified + device_token persistent
          # à travers les redirects -L (--cookie "k=v" ne persiste pas après redirect)
          printf 'localhost\tFALSE\t/\tFALSE\t2147483647\tage_verified\t1\n' > /tmp/cookies-customer.txt
          printf 'localhost\tFALSE\t/\tFALSE\t2147483647\tdevice_token\tmock-jwt-sophie-active-001\n' >> /tmp/cookies-customer.txt

          curl -s \
            -b /tmp/cookies-customer.txt \
            -c /tmp/cookies-customer.txt \
            "$BASE/fr" > /tmp/login.html

          CSRF=$(grep -oP 'name="csrf_token" value="\K[^"]+' /tmp/login.html | head -1)
          echo "DEBUG customer CSRF=${CSRF:0:8}…"

          curl -s \
            -b /tmp/cookies-customer.txt \
            -c /tmp/cookies-customer.txt \
            --data-urlencode "email=client.verifie@dev.local" \
            --data-urlencode "password=Dev123456789!" \
            --data-urlencode "csrf_token=$CSRF" \
            -X POST -L "$BASE/fr/connexion" > /tmp/login-response-customer.html

          TOKEN=$(grep $'\tauth_token\t' /tmp/cookies-customer.txt | awk '{print $NF}')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          if [ -n "$TOKEN" ]; then
            echo "✅ customer auth OK"
          else
            echo "⚠️ customer auth KO — scan anonyme"
            echo "DEBUG response (50 lignes) :"
            head -50 /tmp/login-response-customer.html || true
          fi

      # ── ZAP Full Scan — rôle customer ─────────────────────────────────────────
      # Auth via ZAP_AUTH_HEADER* (déjà passés -e en docker) — évite -config replacer
      # dont getopt parse "-config" comme "-c onfig" (option c: + arg "onfig").
      - name: Set ZAP auth env — customer
        run: |
          echo "ZAP_AUTH_HEADER=Cookie" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_VALUE=auth_token=${{ steps.auth-customer.outputs.token }};age_verified=1" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_SITE=http://${{ steps.host-ip.outputs.ip }}:8080" >> $GITHUB_ENV

      - name: Grant ZAP container write access to workspace
        run: chmod a+w "$GITHUB_WORKSPACE"

      - name: Seed URLs customer — remplacer TARGET par l'IP réelle
        run: |
          IP="${{ steps.host-ip.outputs.ip }}"
          sed "s|TARGET|${IP}:8080|g" .zap/urls-customer.txt > .zap/urls-customer-ci.txt

      - name: Debug — vérifier auth customer avant scan
        run: |
          BASE="http://localhost:8080"
          TOKEN="${{ steps.auth-customer.outputs.token }}"
          if [ -z "$TOKEN" ]; then
            echo "❌ token customer vide — scan sera anonyme"
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Cookie: auth_token=$TOKEN;age_verified=1" \
            "$BASE/fr/mon-compte")
          echo "GET /fr/mon-compte → HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ auth customer OK" || echo "⚠️ auth customer KO (code $HTTP)"

      - name: ZAP Full Scan — customer (mon-compte, panier, checkout)
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'http://${{ steps.host-ip.outputs.ip }}:8080/fr'
          rules_file_name: '.zap/rules.tsv'
          context_file_name: '.zap/contexts/customer.context'
          ajax_spider: true
          cmd_options: '-l .zap/urls-customer-ci.txt'
          fail_action: false
          issue_title: '[DAST] ZAP Full Scan (customer) — alertes'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-full-customer-${{ github.run_number }}

      # ── Authentification admin (admin@dev.local) ──────────────────────────────
      - name: Login — admin
        id: auth-admin
        run: |
          BASE="http://localhost:8080"

          # Pré-seed cookie jar au format Netscape : age_verified + device_token persistent
          printf 'localhost\tFALSE\t/\tFALSE\t2147483647\tage_verified\t1\n' > /tmp/cookies-admin.txt
          printf 'localhost\tFALSE\t/\tFALSE\t2147483647\tdevice_token\tmock-jwt-admin-active-001\n' >> /tmp/cookies-admin.txt

          curl -s \
            -b /tmp/cookies-admin.txt \
            -c /tmp/cookies-admin.txt \
            "$BASE/fr" > /tmp/login.html

          CSRF=$(grep -oP 'name="csrf_token" value="\K[^"]+' /tmp/login.html | head -1)
          echo "DEBUG admin CSRF=${CSRF:0:8}…"

          curl -s \
            -b /tmp/cookies-admin.txt \
            -c /tmp/cookies-admin.txt \
            --data-urlencode "email=admin@dev.local" \
            --data-urlencode "password=Dev123456789!" \
            --data-urlencode "csrf_token=$CSRF" \
            -X POST -L "$BASE/fr/connexion" > /tmp/login-response-admin.html

          TOKEN=$(grep $'\tauth_token\t' /tmp/cookies-admin.txt | awk '{print $NF}')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          if [ -n "$TOKEN" ]; then
            echo "✅ admin auth OK"
          else
            echo "⚠️ admin auth KO — scan anonyme"
            echo "DEBUG response (50 lignes) :"
            head -50 /tmp/login-response-admin.html || true
          fi

      # ── ZAP Full Scan — rôle admin ────────────────────────────────────────────
      - name: Set ZAP auth env — admin
        run: |
          echo "ZAP_AUTH_HEADER=Cookie" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_VALUE=auth_token=${{ steps.auth-admin.outputs.token }};age_verified=1" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_SITE=http://${{ steps.host-ip.outputs.ip }}:8080" >> $GITHUB_ENV

      - name: Debug — vérifier auth admin avant scan
        run: |
          BASE="http://localhost:8080"
          TOKEN="${{ steps.auth-admin.outputs.token }}"
          if [ -z "$TOKEN" ]; then
            echo "❌ token admin vide — scan sera anonyme"
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Cookie: auth_token=$TOKEN;age_verified=1" \
            "$BASE/admin")
          echo "GET /admin → HTTP $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ auth admin OK" || echo "⚠️ auth admin KO (code $HTTP)"

      - name: Seed URLs admin — remplacer TARGET par l'IP réelle
        run: |
          IP="${{ steps.host-ip.outputs.ip }}"
          sed "s|TARGET|${IP}:8080|g" .zap/urls-admin.txt > .zap/urls-admin-ci.txt

      - name: ZAP Full Scan — admin (/admin/*)
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.13.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'http://${{ steps.host-ip.outputs.ip }}:8080/admin'
          rules_file_name: '.zap/rules.tsv'
          context_file_name: '.zap/contexts/admin.context'
          ajax_spider: true
          cmd_options: '-l .zap/urls-admin-ci.txt'
          fail_action: false
          issue_title: '[DAST] ZAP Full Scan (admin) — alertes'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-full-admin-${{ github.run_number }}
