name: DAST — Full Scan (ISO prod)

# Credentials seed (données mock — jamais en production) :
#   super_admin : superadmin@dev.local  / Dev123456789!  / device_token: mock-jwt-admin-active-001
#   admin       : admin@dev.local       / Dev123456789!  / device_token: mock-jwt-admin-active-001
#   customer    : client.verifie@dev.local / Dev123456789! / device_token: mock-jwt-sophie-active-001

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  zap-full:
    name: ZAP Full Scan — PHP server ISO prod (3 rôles)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write

    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crabitan_bellevue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, zip, intl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies & build
        run: npm ci --ignore-scripts && npm run build

      - name: Apply schema & seed
        run: |
          mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/schema.sql
          mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/seed_mock_data.sql

      - name: Create .env (APP_ENV=test — cookies non-secure pour HTTP local)
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8080
          APP_NAME="Crabitan Bellevue"
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=crabitan_bellevue
          DB_USER=root
          DB_PASS=root
          JWT_SECRET=dast-ci-jwt-secret-not-for-prod
          JWT_EXPIRY=3600
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USER=noreply@crabitanbellevue.fr
          MAIL_PASS=unused
          MAIL_FROM_NAME="Crabitan Bellevue"
          CONTACT_OWNER_EMAIL=owner@crabitanbellevue.fr
          DPO_EMAIL=dpo@crabitanbellevue.fr
          SECURITY_EMAIL=security@crabitanbellevue.fr
          CA_API_URL=
          CA_API_KEY=
          CA_ENABLE_GAE=false
          DB_ENCRYPT_KEY=dast-ci-encrypt-key-not-for-prod
          DEFAULT_LANG=fr
          INVOICE_AUTO_GENERATE=false
          EOF

      - name: Start PHP built-in server
        run: php -S 0.0.0.0:8080 -t public/ public/router.php &

      - name: Wait for server
        run: curl --retry 15 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://localhost:8080/

      - name: Resolve host IP for ZAP Docker target
        id: host-ip
        run: echo "ip=$(ip route show default | awk '/default/{print $3}')" >> $GITHUB_OUTPUT

      # ── Authentification customer (client.verifie@dev.local) ──────────────────
      - name: Login — customer
        id: auth-customer
        run: |
          BASE="http://localhost:8080"

          # age_verified=1 requis : sans ce cookie, l'age-gate intercepte la page login
          # et le formulaire avec csrf_token n'est jamais rendu côté HTML
          curl -s \
            --cookie "age_verified=1" \
            -c /tmp/cookies-customer.txt \
            "$BASE/fr" > /tmp/login.html

          CSRF=$(grep -oP 'name="csrf_token" value="\K[^"]+' /tmp/login.html | head -1)
          echo "DEBUG customer CSRF=${CSRF:0:8}…"

          curl -s \
            -b /tmp/cookies-customer.txt \
            -c /tmp/cookies-customer.txt \
            --cookie "device_token=mock-jwt-sophie-active-001; age_verified=1" \
            --data-urlencode "email=client.verifie@dev.local" \
            --data-urlencode "password=Dev123456789!" \
            --data-urlencode "csrf_token=$CSRF" \
            -X POST -L "$BASE/fr/connexion" > /tmp/login-response-customer.html

          TOKEN=$(grep $'\tauth_token\t' /tmp/cookies-customer.txt | awk '{print $NF}')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          if [ -n "$TOKEN" ]; then
            echo "✅ customer auth OK"
          else
            echo "⚠️ customer auth KO — scan anonyme"
            echo "DEBUG response (50 lignes) :"
            head -50 /tmp/login-response-customer.html || true
          fi

      # ── ZAP Full Scan — rôle customer ─────────────────────────────────────────
      - name: ZAP Full Scan — customer (mon-compte, panier, checkout)
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.11.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'http://${{ steps.host-ip.outputs.ip }}:8080'
          auth_header: 'Cookie: auth_token=${{ steps.auth-customer.outputs.token }}; age_verified=1'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          cmd_options: '-config network.connection.timeoutInSecs=20'
          issue_title: '[DAST] ZAP Full Scan (customer) — alertes'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-full-customer-${{ github.run_number }}

      # ── Authentification admin (admin@dev.local) ──────────────────────────────
      - name: Login — admin
        id: auth-admin
        run: |
          BASE="http://localhost:8080"

          curl -s \
            --cookie "age_verified=1" \
            -c /tmp/cookies-admin.txt \
            "$BASE/fr" > /tmp/login.html

          CSRF=$(grep -oP 'name="csrf_token" value="\K[^"]+' /tmp/login.html | head -1)
          echo "DEBUG admin CSRF=${CSRF:0:8}…"

          curl -s \
            -b /tmp/cookies-admin.txt \
            -c /tmp/cookies-admin.txt \
            --cookie "device_token=mock-jwt-admin-active-001; age_verified=1" \
            --data-urlencode "email=admin@dev.local" \
            --data-urlencode "password=Dev123456789!" \
            --data-urlencode "csrf_token=$CSRF" \
            -X POST -L "$BASE/fr/connexion" > /tmp/login-response-admin.html

          TOKEN=$(grep $'\tauth_token\t' /tmp/cookies-admin.txt | awk '{print $NF}')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          if [ -n "$TOKEN" ]; then
            echo "✅ admin auth OK"
          else
            echo "⚠️ admin auth KO — scan anonyme"
            echo "DEBUG response (50 lignes) :"
            head -50 /tmp/login-response-admin.html || true
          fi

      # ── ZAP Full Scan — rôle admin ────────────────────────────────────────────
      - name: ZAP Full Scan — admin (/admin/*)
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.11.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'http://${{ steps.host-ip.outputs.ip }}:8080/admin'
          auth_header: 'Cookie: auth_token=${{ steps.auth-admin.outputs.token }}; age_verified=1'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          cmd_options: '-config network.connection.timeoutInSecs=20'
          issue_title: '[DAST] ZAP Full Scan (admin) — alertes'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-full-admin-${{ github.run_number }}
