name: Release

on:
  push:
    branches:
      - main
      - alpha

# Permissions minimales au niveau workflow — le job release surcharge au besoin
permissions: read-all

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch nested vulnerabilities in @semantic-release/npm bundle
        # brace-expansion + picomatch sont bundlés dans node_modules/npm (via @semantic-release/npm).
        # Inaccessibles via package.json overrides — on écrase directement les versions vulnérables.
        run: |
          (cd node_modules/npm && npm install brace-expansion@'^2.0.3' --no-save --ignore-scripts --no-audit 2>/dev/null) || true
          (cd node_modules/npm/node_modules/tinyglobby && npm install picomatch@'^4.0.4' --no-save --ignore-scripts --no-audit 2>/dev/null) || true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release

      - name: Build assets for provenance
        run: |
          find public/assets -type f \( -name "*.js" -o -name "*.css" \) \
            -exec sha256sum {} \; > build-checksums.txt
          echo "Build checksums generated"

      - name: Generate SLSA provenance (L2)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'build-checksums.txt'
