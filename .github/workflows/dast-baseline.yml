name: DAST — Baseline Scan (prod)

on:
  schedule:
    - cron: '0 3 * * 0'  # tous les dimanches, 03h00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  zap-baseline:
    name: ZAP Baseline — crabitanbellevue.fr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'https://crabitanbellevue.fr'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          issue_title: '[DAST] ZAP Baseline — alertes de sécurité'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-baseline-${{ github.run_number }}
