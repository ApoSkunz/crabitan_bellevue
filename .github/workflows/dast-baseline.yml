name: DAST — Baseline Scan (prod)

on:
  schedule:
    - cron: '0 3 1 * *'  # 1er de chaque mois, 03h00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  zap-baseline:
    name: ZAP Baseline — crabitanbellevue.fr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Grant ZAP container write access to workspace
        run: chmod a+w "$GITHUB_WORKSPACE"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0  # TODO: pin to SHA — Dependabot le mettra à jour
        with:
          target: 'https://crabitanbellevue.fr'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          issue_title: '[DAST] ZAP Baseline — alertes de sécurité'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: zap-baseline-${{ github.run_number }}
