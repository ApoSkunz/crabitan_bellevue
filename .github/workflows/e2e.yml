name: E2E

on:
  workflow_dispatch: # relance manuelle uniquement — E2E automatique géré par ci.yml

permissions: read-all

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crabitan_bellevue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run schema on test DB
        run: mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/schema.sql

      - name: Seed mock data for E2E
        run: mysql -h 127.0.0.1 -u root -proot crabitan_bellevue < database/seed_mock_data.sql

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          APP_ENV=test
          APP_URL=http://localhost:8080
          APP_NAME="Crabitan Bellevue"
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=crabitan_bellevue
          DB_USER=root
          DB_PASS=root
          JWT_SECRET=ci-test-secret-key
          JWT_EXPIRY=3600
          MAIL_HOST=localhost
          MAIL_PORT=587
          MAIL_USER=noreply@crabitanbellevue.fr
          MAIL_PASS=unused
          MAIL_FROM_NAME="Crabitan Bellevue"
          CA_API_URL=
          CA_API_KEY=
          DB_ENCRYPT_KEY=ci-test-encrypt-key-e2e
          EOF

      - name: Build assets
        run: npm run build

      - name: Start PHP server
        run: php -S 0.0.0.0:8080 -t public/ public/router.php &

      - name: Wait for server
        run: curl --retry 15 --retry-delay 1 --retry-connrefused --silent --output /dev/null http://localhost:8080/

      - name: Run Playwright (Chromium)
        env:
          APP_URL: http://localhost:8080
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
